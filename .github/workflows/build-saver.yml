name: Build Saver

# The screensaver's AppKit layer compiles only on macOS, so this is the only
# place it is type-checked at all: test the core, build the universal .saver,
# prove macOS can load it, and attach it as a ready-to-install zip.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'AlbumArtworkSaver/**'
      - '.github/workflows/build-saver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        # An explicit bash runs with -eo pipefail, so a failure on the left of
        # a pipe fails the step.
        shell: bash
        working-directory: AlbumArtworkSaver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Test core
        run: swift test

      - name: Build the saver
        # Universal, so the zip runs on Apple Silicon and Intel Macs alike.
        env:
          ARCHS: "arm64 x86_64"
        run: ./build-saver.sh

      - name: Check the bundle
        run: |
          BIN=build/AlbumArtwork.saver/Contents/MacOS/AlbumArtwork
          KIND="$(file "$BIN")"
          echo "$KIND"
          grep -q bundle <<<"$KIND"
          lipo "$BIN" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" \
            build/AlbumArtwork.saver/Contents/Info.plist
          codesign --verify --verbose build/AlbumArtwork.saver

      - name: Load the bundle
        run: swift Scripts/load-saver.swift build/AlbumArtwork.saver | grep '^OK AlbumArtworkView'

      - name: Scan test
        # The scanner end to end, through TestHost --scan (no window needed):
        # incremental scans, a missing music folder, two scans at once, and
        # the music folder left untouched.
        run: Scripts/scan-test.sh build/TestHost

      - name: Run the wall in the TestHost
        # A GUI app needs a window server. Hosted runners have one; if not, say
        # so and go on. A TestHost that quits on its own fails the job: first
        # without covers (the wall stays black), then with 120 fixture covers,
        # stopped for 2 s on the way like a paused screensaver (the wall must
        # restart), then with a fixture music folder scanned into a fresh
        # cache. Both walls must log that they started, and the scan that it
        # completed. The frame times the wall logs are printed, not checked.
        run: |
          if ! pgrep -x WindowServer >/dev/null; then
            echo "::warning::No WindowServer on this runner, so the TestHost runs were skipped."
            exit 0
          fi
          launch_host() {
            ./build/TestHost "$@" >build/testhost.log 2>&1 &
            host_pid=$!
          }
          # expect_running <seconds>: fails the step if the TestHost quits within them.
          expect_running() {
            local status=0
            sleep "$1"
            if ! kill -0 "$host_pid" 2>/dev/null; then
              wait "$host_pid" || status=$?
              echo "✗ TestHost quit (exit status $status):"
              cat build/testhost.log
              exit 1
            fi
            echo "✓ TestHost still running after another $1 s (pid $host_pid)."
          }
          stop_host() {
            kill "$host_pid"
            wait "$host_pid" 2>/dev/null || true
            cat build/testhost.log
          }
          # fetch_log: the saver's log of the last minutes (categories wall and scan).
          fetch_log() {
            log show --last 5m --style compact \
              --predicate 'subsystem == "app.beamerpresenter.AlbumArtworkSaver"' >build/saver.log 2>&1 || true
          }
          # expect_log <text>: fails the step unless the running TestHost logged
          # <text>. The log can lag behind, so it asks a few times.
          expect_log() {
            local _
            for _ in 1 2 3 4 5; do
              fetch_log
              if grep -Eq "TestHost\[${host_pid}[]:].*$1" build/saver.log; then
                echo "✓ TestHost $host_pid logged \"$1\"."
                return 0
              fi
              sleep 2
            done
            echo "✗ TestHost $host_pid never logged \"$1\". What log show gave:"
            tail -n 40 build/saver.log
            exit 1
          }
          show_log() {
            echo "▶︎ The log of TestHost $host_pid:"
            grep -E "TestHost\[${host_pid}[]:]" build/saver.log || true
          }
          launch_host
          expect_running 5
          stop_host
          python3 Scripts/make-fixtures.py images 120 "$RUNNER_TEMP/aa-covers"
          launch_host --covers "$RUNNER_TEMP/aa-covers"
          expect_running 10
          kill -STOP "$host_pid"
          sleep 2
          kill -CONT "$host_pid"
          expect_running 10
          expect_log "wall started after"
          show_log
          stop_host
          python3 Scripts/make-fixtures.py mp3 "$RUNNER_TEMP/aa-music"
          launch_host --music "$RUNNER_TEMP/aa-music" --cache "$RUNNER_TEMP/aa-music-cache"
          expect_running 8
          expect_log "scan: complete"
          expect_log "wall started after"
          show_log
          stop_host

      - name: Zip it
        # ditto keeps the bundle's symlinks and resource forks; zip(1) does not.
        run: ditto -c -k --sequesterRsrc --keepParent build/AlbumArtwork.saver AlbumArtwork-saver.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AlbumArtwork-saver
          path: AlbumArtworkSaver/AlbumArtwork-saver.zip
          if-no-files-found: error
