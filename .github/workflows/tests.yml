name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment).
jobs:
  swift:
    # Foundation-only BeamerCore + BeamerCoreTests (the app targets need
    # AppKit/UIKit and only build on macOS).
    runs-on: ubuntu-latest
    container: swift:5.10-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: swift test
        run: swift test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: Linux/src-tauri

      - name: cargo test
        working-directory: Linux/src-tauri
        run: cargo test --locked

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: node --test
        run: node --test Linux/ui/test/*.test.mjs
