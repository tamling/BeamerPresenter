name: Checks

# The colour check needs no toolchain — standard-library Python, no network —
# so it runs on every push to every branch rather than only where the platform
# builds do. It is cheap, and the thing it guards (one brand colour across four
# source files and four committed PNGs) is exactly the kind that breaks quietly
# between releases.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Brand colour — parity, contrast, distance, icons
        run: python3 Tools/check_colors.py
