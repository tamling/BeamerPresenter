name: Linux .deb

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .deb to releases on tag pushes
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Linux/src-tauri

      - name: Build .deb
        run: ./Linux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BeamerPresenter-deb
          path: Linux/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Linux/src-tauri/target/release/bundle/deb/*.deb
