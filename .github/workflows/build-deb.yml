name: Linux .deb

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish/update the release carrying the .deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in the build needs git write access, and the release step
          # gets its token through the API — so don't leave a push credential
          # in .git/config for every later step to read.
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev

      # Third-party actions are pinned to commit SHAs: a tag or branch can be
      # repointed at new code, which would then run in this job and could
      # rewrite the .deb that the release step publishes.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: Linux/src-tauri

      - name: Build .deb
        run: ./Linux/build-deb.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BeamerPresenter-deb
          path: Linux/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Read app version
        id: appver
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Linux/src-tauri/Cargo.toml | head -1)"
          # The release is keyed to the app version, so a tag that names a
          # different one would replace the .deb on an already-published
          # release instead of its own.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match the app version $version" >&2
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every push to main publishes/updates the release for the current app
      # version, with the .deb attached — so the download always sits on the
      # repo's Releases page, no local toolchain needed.
      - name: Publish release with .deb
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: BeamerPresenter ${{ steps.appver.outputs.version }}
          files: Linux/src-tauri/target/release/bundle/deb/*.deb
