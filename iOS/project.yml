# XcodeGen spec for the iPad app. Generate the Xcode project with:
#
#   brew install xcodegen      # once
#   cd iOS && xcodegen generate
#   open BeamerPresenter.xcodeproj
#
# Then set your signing team and run on the iPad.
name: BeamerPresenter
options:
  bundleIdPrefix: app.beamerpresenter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BeamerPresenter:
    type: application
    platform: iOS
    sources:
      - BeamerPresenter
    preBuildScripts:
      - name: Stamp build ID
        basedOnDependencyAnalysis: false
        script: |
          DATE6=$(date -u +%y%m%d)
          HEX=$(git -C "$SRCROOT" rev-parse --short=6 HEAD 2>/dev/null || echo 0)
          BUILD_ID="${DATE6}-$(printf '%d' "0x$HEX" 2>/dev/null || echo 0)"
          cat > "$SRCROOT/BeamerPresenter/BuildInfo.swift" <<EOF
          // Generated at build time — do not edit.
          enum BuildInfo {
              static let id = "$BUILD_ID"
          }
          EOF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamerpresenter.ios
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone (remote) + iPad (presenter)
        MARKETING_VERSION: "4.5"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""               # ← set your Apple Developer team in Xcode
        CODE_SIGN_STYLE: Automatic
    info:
      path: BeamerPresenter/Info.plist
      properties:
        CFBundleDisplayName: BeamerPresenter
        CFBundleShortVersionString: "4.5"
        CFBundleVersion: "12"
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone-as-remote talks to the iPad over the local network (Multipeer).
        NSLocalNetworkUsageDescription: Connect to a nearby BeamerPresenter to control the presentation.
        NSBonjourServices:
          - _bp-remote._tcp
          - _bp-remote._udp
        # Open PDFs from the Files app / iCloud Drive
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
