# XcodeGen spec for the iPad app. Generate the Xcode project with:
#
#   brew install xcodegen      # once
#   cd iOS && xcodegen generate
#   open BeamerPresenter.xcodeproj
#
# Then set your signing team and run on the iPad.
name: BeamerPresenter
options:
  bundleIdPrefix: app.beamerpresenter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BeamerPresenter:
    type: application
    platform: iOS
    sources:
      - BeamerPresenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.beamerpresenter.ios
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone (remote) + iPad (presenter)
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""               # ← set your Apple Developer team in Xcode
        CODE_SIGN_STYLE: Automatic
    info:
      path: BeamerPresenter/Info.plist
      properties:
        CFBundleDisplayName: BeamerPresenter
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone-as-remote talks to the iPad over the local network (Multipeer).
        NSLocalNetworkUsageDescription: Connect to a nearby BeamerPresenter to control the presentation.
        NSBonjourServices:
          - _bp-remote._tcp
          - _bp-remote._udp
        # Open PDFs from the Files app / iCloud Drive
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
